[project]
name = "quant-desk"
version = "0.1.0"
description = "Modular, paper-only-by-default quantitative trading research platform (spine)."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "yfinance>=0.2.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quant-desk = "quant_desk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant_desk"]
